apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-client
  namespace: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-client
  template:
    metadata:
      labels:
        app: angular-client
    spec:
      containers:
        - name: angular-client
          # Replace this image with your registry/image name after building
          image: save8198/angularclient:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80

---
apiVersion: v1
kind: Service
metadata:
  name: angular-client
  namespace: dotnet-app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
      name: http
  selector:
    app: angular-client
