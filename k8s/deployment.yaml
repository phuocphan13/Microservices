              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__OrderingConnectionString
              value: Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True
            - name: ConnectionStrings__IsRebuildSchema
              value: "false"
            - name: Worker__IsRebuildSchema
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
