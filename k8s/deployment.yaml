apiVersion: v1
kind: Namespace
metadata:
  name: dotnet-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: ${DOCKERHUB_USERNAME}/catalogapi:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: DatabaseSettings__MongoDb__ConnectionString
              value: mongodb://catalogdb:27017
            - name: DatabaseSettings__MongoDb__DatabaseName
              value: CatalogDb
            - name: DatabaseSettings__MongoDb__IsRebuildSchema
              value: "false"
            - name: CacheSettings__ConnectionString
              value: catalog_cache:6379
            - name: DiscountGrpc__BaseUrl
              value: http://discount-api:8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: dotnet-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: catalog-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
  namespace: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
