apiVersion: apps/v1
kind: Deployment
metadata:
  name: discountdb
  namespace: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discountdb
  template:
    metadata:
      labels:
        app: discountdb
    spec:
      containers:
        - name: postgres
          image: postgres:14.22
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: DiscountDb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: discountdb
  namespace: dotnet-app
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: discountdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderdb
  namespace: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderdb
  template:
    metadata:
      labels:
        app: orderdb
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2017-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              value: "Your_password123"
---
apiVersion: v1
kind: Service
metadata:
  name: orderdb
  namespace: dotnet-app
spec:
  type: ClusterIP
  ports:
    - port: 1433
      targetPort: 1433
  selector:
    app: orderdb
